[project]
name = "fastmcp-py38-bootstrap"
version = "0.0.0"
description = "Temporary test tooling for the FastMCP Python 3.8 migration."
requires-python = ">=3.8,<3.9"
dependencies = []

[dependency-groups]
dev = [
    "dirty-equals>=0.9.0",
    "hypothesis",
    "inline-snapshot[dirty-equals]>=0.27.2",
    "pytest>=8.3.3,<8.4",
    "pytest-asyncio>=0.24,<0.25",
    "pytest-cov>=5,<6",
    "pytest-env>=1.1.5",
    "pytest-flakefinder>=1.1.0",
    "pytest-report>=0.2.1",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.6.1",
]

[tool.uv]
default-groups = ["dev"]
package = false

[tool.uv.workspace]
