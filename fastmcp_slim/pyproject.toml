[project]
name = "fastmcp-slim"
dynamic = ["version", "optional-dependencies"]
description = "The dependency-slim FastMCP package."
authors = [{ name = "Jeremiah Lowin" }, { name = "Nate Nowack" }]
dependencies = [
    "eval-type-backport>=0.4.0; python_version < '3.10'",
    "importlib-resources>=5.0.0; python_version < '3.9'",
    "mcp-types>=2.0.0,<3.0.0",
    "platformdirs>=4.0.0",
    "pydantic[email]==2.10.6; python_version < '3.9'",
    "pydantic[email]>=2.12.0; python_version >= '3.9'",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.1,<1.1.0; python_version < '3.9'",
    "python-dotenv>=1.1.0; python_version >= '3.9'",
    "rich>=13.9.4",
    "typing-extensions>=4.0.0",
]

requires-python = ">=3.8, !=3.9.*, !=3.10.*"
readme = "README.md"
license = "Apache-2.0"

keywords = [
    "mcp",
    "mcp server",
    "mcp client",
    "model context protocol",
    "fastmcp",
    "llm",
    "agent",
]
classifiers = [
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://gofastmcp.com"
Repository = "https://github.com/PrefectHQ/fastmcp"
Documentation = "https://gofastmcp.com"

[project.scripts]
fastmcp = "fastmcp.cli:app"

[build-system]
requires = ["hatchling", "uv-dynamic-versioning>=0.7.0"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["fastmcp"]

[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
bump = true
fallback-version = "0.0.0"

[tool.uv]
# The dynamic version and FastMCP sibling pins include the Git revision.
cache-keys = [
    { file = "pyproject.toml" },
    { git = { commit = true, tags = true } },
]

[tool.hatch.metadata.hooks.uv-dynamic-versioning.optional-dependencies]
anthropic = ["certifi>=2026.10.19", "anthropic>=0.48.0,<2"]
# MCP Apps UI is not available in the Python 3.8 internal deployment.
apps = ["prefab-ui>=0.18.0; python_version >= '3.11'"]
# PyJWT floor: transitive via msal; CVE-2026-32597 affects <= 2.11.0
# Azure Identity is intentionally unavailable in the Python 3.8 internal
# deployment; Python 3.11+ retains the upstream extra and its secure PyJWT
# floor.
azure = [
    "certifi>=2026.10.19; python_version >= '3.11'",
    "azure-identity>=1.16.0; python_version >= '3.11'",
    "PyJWT>=2.12.0; python_version >= '3.11'",
]
client = [
    "fastmcp-slim[mcp]=={{ version }}",
    "authlib>=1.3.2,<1.4.0; python_version < '3.11'",
    "authlib>=1.9.5; python_version >= '3.11'",
    "beartype>=0.23.0rc2; python_version >= '3.15'",
    "py-key-value-aio[filetree,memory]>=0.4.6,<0.6.0",
]
code-mode = [
    "pydantic-monty>=1.1,<2",
    # UV source overrides must also cover the local metapackage's native parts.
    "pydantic-monty-client==1.1.0; python_version < '3.11'",
    "pydantic-monty-runtime==1.1.0; python_version < '3.11'",
]
fastapi = [
    "fastapi>=0.115.12,<0.125.0; python_version < '3.11'",
    "fastapi>=0.115.12; python_version >= '3.11'",
]
jev = ["typesafe-sdk>=0.5.7"]
gemini = [
    "certifi>=2026.10.19; python_version >= '3.11'",
    "google-genai>=1.18.0; python_version >= '3.11'",
    "jsonref>=1.1.0; python_version >= '3.11'",
]
mcp = [
    "exceptiongroup>=1.2.2",
    # FastMCP uses httpx2 exclusively: the MCP SDK boundary (client transports,
    # client auth) requires it, and all FastMCP-owned HTTP (server auth provider
    # upstream calls, OpenAPI provider, version check, etc.) uses it too.
    "httpx2>=2.5.0",
    "mcp>=2.3.0,<3.0.0",
    # opentelemetry-api floor: extract_trace_context feeds client-supplied
    # _meta.traceparent to the W3C propagator. Pin past CVE-2026-126360
    # (ReDoS on crafted traceparent), which was patched in 1.45.2.
    "opentelemetry-api>=1.33.1; python_version < '3.10'",
    "opentelemetry-api>=1.45.2; python_version >= '3.10'",
    # starlette floor: transitive via mcp (which only requires >=0.27).
    # Pin past CVE-2026-48710, which was patched in 1.0.1.
    "starlette>=0.44.0,<1.0.0; python_version < '3.11'",
    "starlette>=1.0.1; python_version >= '3.11'",
]
openai = ["certifi>=2026.10.19", "openai>=1.102.0"]
server = [
    "certifi>=2026.10.19",
    "fastmcp-slim[mcp]=={{ version }}",
    "authlib>=1.3.2,<1.4.0; python_version < '3.11'",
    "authlib>=1.9.5; python_version >= '3.11'",
    "beartype>=0.23.0rc2; python_version >= '3.15'",
    "cyclopts>=2.9.9,<3.0.0; python_version < '3.11'",
    "cyclopts>=4.0.0; python_version >= '3.11'",
    "griffe>=1.4.0,<2.0.0; python_version < '3.11'",
    "griffelib>=2.0.0; python_version >= '3.11'",
    "jsonref>=1.1.0",
    "jsonschema>=4.20.0",
    "jsonschema-path>=0.3.4",
    "joserfc>=1.2.2,<1.3.0; python_version < '3.11'",
    "joserfc>=1.7.6; python_version >= '3.11'",
    "openapi-pydantic>=0.5.1,<0.6.0; python_version < '3.11'",
    "openapi-pydantic>=0.6.0; python_version >= '3.11'",
    "packaging>=24.0",
    "py-key-value-aio[filetree,memory]>=0.4.6,<0.6.0",
    "pyperclip>=1.9.0",
    "python-multipart>=0.0.20,<0.0.26; python_version < '3.11'",
    "python-multipart>=0.0.26; python_version >= '3.11'",
    "pyyaml>=6.0,<7.0",
    "uncalled-for>=0.6.1",
    "uvicorn>=0.33.0,<0.34.0; python_version < '3.11'",
    "uvicorn>=0.35; python_version >= '3.11'",
    "watchfiles>=0.24.0,<1.0.0; python_version < '3.11'",
    "watchfiles>=1.0.0; python_version >= '3.11'",
    "websockets>=13.1,<15.0.0; python_version < '3.11'",
    "websockets>=15.0.1; python_version >= '3.11'",
]
