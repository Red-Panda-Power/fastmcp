[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "pydocket"
version = "0.29.1+py38"
description = "A distributed background task system for Python functions"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.8"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Chris Guidry", email = "guid@omg.lol" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
dependencies = [
    "cloudpickle>=3.1.1",
    "cronsim>=2.6",
    "burner-redis>=0.1.7",
    "opentelemetry-api>=1.33.0,<1.45.0",
    "prometheus-client>=0.21.1",
    "py-key-value-aio[memory,redis]>=0.3.0",
    "python-json-logger>=2.0.7",
    "redis>=5.2.0,<6",
    "rich>=13.9.4",
    "typer>=0.15.1",
    "typing_extensions>=4.12.0",
    "tzdata>=2025.2; sys_platform == 'win32'",
    "uncalled-for>=0.6.0",
    "exceptiongroup>=1.2.2; python_version < '3.11'",
    "eval-type-backport>=0.4.0; python_version < '3.10'",
    "importlib-resources>=5.12; python_version < '3.9'",
]

[project.optional-dependencies]
metrics = [
    "opentelemetry-sdk>=1.33.0,<1.45.0",
]

[dependency-groups]
dev = [
    "docker>=7.1.0",
    # Python 3.8's last compatible urllib3 line is 2.2.x.  Later releases
    # fix additional decompression issues but require a newer interpreter.
    "urllib3>=2.2.3,<2.3; python_version < '3.9'",
    "urllib3>=2.6.3; python_version >= '3.9'",
    "opentelemetry-distro>=0.53b0,<0.60b0; python_version < '3.9'",
    "opentelemetry-distro>=0.60b0; python_version >= '3.9'",
    "opentelemetry-exporter-otlp>=1.33.0",
    "opentelemetry-exporter-prometheus>=0.53b0,<0.60b0; python_version < '3.9'",
    "opentelemetry-exporter-prometheus>=0.60b0; python_version >= '3.9'",
    "opentelemetry-instrumentation>=0.53b0,<0.60b0; python_version < '3.9'",
    "opentelemetry-instrumentation>=0.60b0; python_version >= '3.9'",
    "opentelemetry-instrumentation-logging>=0.53b0,<0.60b0; python_version < '3.9'",
    "opentelemetry-instrumentation-logging>=0.60b0; python_version >= '3.9'",
    "opentelemetry-instrumentation-redis>=0.53b0,<0.60b0; python_version < '3.9'",
    "opentelemetry-instrumentation-redis>=0.60b0; python_version >= '3.9'",
    "opentelemetry-sdk>=1.33.0",
    "pyright>=1.1.408",
    "pytest>=8.3.3,<9",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0,<6; python_version < '3.9'",
    "pytest-cov>=6.0.0; python_version >= '3.9'",
    "pytest-flakefinder>=1.1.0",
    "pytest-randomly>=3.15.0,<4; python_version < '3.9'",
    "pytest-randomly>=4.0.0; python_version >= '3.9'",
    "pytest-repeat>=0.9.3",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.6.1",
    "ruff>=0.14.14",
]

[project.scripts]
docket = "docket.__main__:app"

[project.urls]
"Homepage" = "https://docket.lol/"
"Documentation" = "https://docket.lol/en/latest/"
"Repository" = "https://github.com/chrisguidry/docket"
"Bug Tracker" = "https://github.com/chrisguidry/docket/issues"

[tool.hatch.version]
source = "regex"
path = "src/docket/__init__.py"
pattern = "__version__ = ['\\\"](?P<version>[^'\\\"]+)"
# Releases before the monorepo are tagged bare (0.26.0), and later ones
# python/v0.27.0.  Matching only these keeps another language's tag, like
# rust/v0.1.0, out of pydocket's version.
tag-pattern = "^(?:python/v)?(?P<version>\\d+\\.\\d+\\.\\d+.*)$"
raw-options = { root = "..", scm = { git = { describe_command = "git describe --dirty --tags --long --match python/v* --match [0-9]*" } } }

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
target-version = "py38"

[tool.uv.sources]
# Keep this vendored package self-contained for its development checks.  The
# FastMCP workspace declares the same source replacements at its root.
burner-redis = { path = "../burner-redis" }
py-key-value-aio = { path = "../py-key-value" }
uncalled-for = { path = "../uncalled-for" }


[tool.hatch.build.targets.wheel]
packages = ["src/docket"]

[tool.hatch.build.targets.sdist]
exclude = ["conformance-agent"]

[tool.pytest.ini_options]
addopts = [
    "--numprocesses=logical",
    "--maxprocesses=4",
    "--cov=src/docket",
    "--cov=tests",
    "--cov-report=term-missing:skip-covered",
    "--cov-branch",
    "--cov-fail-under=100",
    "--timeout=30",
    "--import-mode=importlib",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "error",
    # redis-py 7.2.0 deprecated lib_name/lib_version on Connection.__init__,
    # but RedisCluster still passes lib_name="redis-py" internally (#341)
    "ignore:Call to.*lib_name.*:DeprecationWarning",
    # redis-py 8.0.0 deprecated setex; py-key-value-aio's RedisStore still
    # calls it internally for standalone result storage (#425)
    "ignore:Call to deprecated setex.*:DeprecationWarning:key_value.aio.stores.redis.store",
    # On Python 3.11, importlib.metadata.entry_points() returns a
    # SelectableGroups, and OpenTelemetry's _importlib_metadata shim consumes
    # it via the deprecated dict interface during import. The shim is theirs
    # to fix, so we scope the ignore to that module (#428).
    "ignore:SelectableGroups dict interface is deprecated.*:DeprecationWarning:opentelemetry.util._importlib_metadata",
]

[tool.coverage.run]
omit = [
    # Entry point wrapper
    "src/docket/__main__.py",
    # Vendored uuid7 implementation
    "src/docket/_uuid7.py",
    # Vendored OpenTelemetry prometheus exporter
    "src/docket/_prometheus_exporter.py",
    # Cluster-only code paths not exercised in standalone tests
    "src/docket/_result_store.py",
    # Fixture branches vary by Redis config (cluster, ACL, memory, valkey)
    "**/conftest.py",
    # Test infrastructure with conditional branches for cluster/standalone
    "tests/_key_leak_checker.py",
    "tests/_container.py",
    # Subprocess coverage hook, exercised by CLI tests only
    "tests/sitecustomize.py",
]
branch = true
parallel = true

[tool.coverage.report]
exclude_also = ["\\.\\.\\.$"]

[tool.pyright]
include = ["src", "tests", "conformance-agent"]
# The agent runs as a directory, so its modules import each other from there.
executionEnvironments = [{ root = "conformance-agent" }]
typeCheckingMode = "strict"
venvPath = ".."
venv = ".venv"
reportUnnecessaryTypeIgnoreComment = "error"
reportUnnecessaryCast = "error"
reportUnnecessaryIsInstance = "error"
reportUnnecessaryComparison = "error"
