[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "py-key-value-aio"
version = "0.4.6"
description = "Async key-value store with pluggable backends"
requires-python = ">=3.8"
license = { file = "LICENSE" }
dependencies = [
    "beartype>=0.19,<0.20; python_version < '3.9'",
    "beartype>=0.20; python_version >= '3.9'",
    "typing-extensions>=4.13.0",
]

[project.optional-dependencies]
## Backends that resolve for CPython 3.8 on both Windows and Linux.
## Aerospike 19's build backend evaluates Python 3.10 ``|`` annotations.
## 18.x remains the latest branch buildable with CPython 3.8.
aerospike = [
    "aerospike>=16.0.0,<19.0.0; python_version < '3.9'",
    "aerospike>=16.0.0; python_version >= '3.9'",
]
azure-tables = ["azure-data-tables>=12.4.0", "azure-core>=1.29.0"]
## DuckDB 1.3+ no longer ships a CPython 3.8 Windows wheel.
duckdb = [
    "duckdb>=1.1.1,<1.3.0; python_version < '3.9'",
    "duckdb>=1.1.1; python_version >= '3.9'",
    "pytz>=2025.2",
]
dynamodb = ["aioboto3>=13.3.0"]
elasticsearch = [
    "elasticsearch[async]>=8.0.0,<9.0.0; python_version < '3.9'",
    "elasticsearch[async]>=8.0.0; python_version >= '3.9'",
    "aiohttp>=3.12.0; python_version >= '3.9'",
]
firestore = ["google-cloud-firestore>=2.13.0", "google-auth>=2.24.0"]
memcached = ["aiomcache>=0.8.0"]
mongodb = [
    "pymongo>=4.9.0,<4.11.0; python_version < '3.9'",
    "pymongo>=4.9.0; python_version >= '3.9'",
]
opensearch = [
    "opensearch-py[async]>=2.0.0,<3.0.0; python_version < '3.9'",
    "opensearch-py[async]>=2.0.0; python_version >= '3.9'",
]
postgresql = [
    "asyncpg>=0.29.0; python_version < '3.9'",
    "asyncpg>=0.30.0; python_version >= '3.9'",
]
rocksdb = [
    "rocksdict>=0.3.2; python_version < '3.12'",
    "rocksdict>=0.3.24; python_version >= '3.12'",
]
s3 = ["aioboto3>=13.3.0"]
vault = ["hvac>=2.3.0"]

## chDB 3.7.2 is the last CPython 3.8-compatible Linux release. GLIDE has no
## usable CPython 3.8 distribution, so the Valkey store uses redis-py there.
chdb = [
    "chdb>=3.7.2,<4.0.0; python_version < '3.9' and sys_platform != 'win32'",
    "chdb>=4.1.1; python_version >= '3.9'",
]
valkey = [
    "redis>=4.3.0; python_version < '3.9'",
    "valkey-glide>=2.1.0; python_version >= '3.9'",
]

## This backend uses only winreg from the Python standard library. The import
## itself gives a clear error when used outside Windows.
registry = []
memory = ["cachetools>=5.0.0"]
disk = [
    "diskcache>=5.0.0",
    "pathvalidate>=3.2,<3.3; python_version < '3.9'",
    "pathvalidate>=3.3.1; python_version >= '3.9'",
]
filetree = [
    "aiofile>=3.5.0,!=3.9.0,<3.10; python_version < '3.11'",
    "aiofile>=3.12.3; python_version >= '3.11'",
    "anyio>=4.4.0",
]
redis = ["redis>=4.3.0"]
keyring = [
    "keyring>=25.5,<25.6; python_version < '3.9'",
    "keyring>=25.6.0; python_version >= '3.9'",
]
pydantic = [
    "pydantic==2.10.6; python_version < '3.9'",
    "pydantic>=2.11.9; python_version >= '3.9'",
    "eval-type-backport>=0.2.0; python_version < '3.10'",
]
wrappers-encryption = ["cryptography>=45.0.0"]

[dependency-groups]
dev = [
    "py-key-value-aio[disk,memory,filetree,keyring,pydantic,redis,wrappers-encryption]",
    "dirty-equals>=0.9.0",
    "fakeredis>=2.0.0",
    "inline-snapshot>=0.27.2",
    "pytest>=8.3.3,<9",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
    "pytest-timeout>=2.4.0",
    "tomli>=2.0.0; python_version < '3.11'",
]

[tool.hatch.build.targets.wheel]
packages = ["src/key_value"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "module"
addopts = ["--inline-snapshot=disable"]
testpaths = ["tests/stores/memory", "tests/stores/filetree", "tests/stores/wrappers", "tests/stores/optional", "tests/adapters"]

[tool.ruff]
target-version = "py38"
line-length = 140
