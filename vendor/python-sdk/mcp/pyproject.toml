[project]
name = "mcp"
version = "2.3.0"
description = "Vendored Model Context Protocol SDK."
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Model Context Protocol a Series of LF Projects, LLC." }]
dependencies = [
    "anyio>=4.10; python_version >= '3.14'",
    "anyio>=4.9; python_version < '3.14'",
    "httpx2>=2.10.0",
    "jsonschema>=4.20.0",
    "mcp-types==2.3.0",
    "opentelemetry-api>=1.28.0",
    "pydantic>=2.12.0",
    "pyjwt[crypto]>=2.10.1",
    "python-multipart>=0.0.9",
    "pywin32>=311; sys_platform == 'win32'",
    "sse-starlette>=3.0.0",
    "starlette>=0.27; python_version < '3.14'",
    "starlette>=0.48.0; python_version >= '3.14'",
    "typing-extensions>=4.13.0",
    "typing-inspection>=0.4.1",
    "uvicorn>=0.31.1; sys_platform != 'emscripten'",
]

[project.optional-dependencies]
cli = ["python-dotenv>=1.0.0", "typer>=0.16.0"]
rich = ["rich>=13.9.4"]

[project.scripts]
mcp = "mcp.cli:app [cli]"

[project.urls]
Repository = "https://github.com/modelcontextprotocol/python-sdk"

[dependency-groups]
dev = [
    "inline-snapshot>=0.27.2",
    "pytest>=8.3.3,<9",
    "pytest-timeout>=2.4.0",
    "trio>=0.26.2",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcp"]

[tool.uv.sources]
httpcore2 = { path = "../../httpx2/httpcore2", editable = true }
httpx2 = { path = "../../httpx2/httpx2", editable = true }
mcp-types = { path = "../mcp-types", editable = true }
