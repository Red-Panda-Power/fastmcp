[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "typing-inspection"
version = "0.4.2"
description = "Runtime typing introspection tools, vendored for Python 3.8."
requires-python = ">=3.8"
license = { file = "LICENSE" }
authors = [{ name = "Victorien Plot", email = "contact@vctrn.dev" }]
dependencies = ["typing-extensions>=4.12.0"]

[project.urls]
Source = "https://github.com/pydantic/typing-inspection/tree/v0.4.2"

[dependency-groups]
dev = ["pytest>=8.3.4,<9"]

[tool.hatch.build.targets.wheel]
packages = ["typing_inspection"]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py38"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
