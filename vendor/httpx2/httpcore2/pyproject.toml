[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "httpcore2"
version = "2.12.0"
description = "A minimal low-level HTTP client, vendored for the FastMCP Python 3.8 port."
requires-python = ">=3.8"
license = { file = "LICENSE.md" }
authors = [{ name = "Tom Christie", email = "tom@tomchristie.com" }]
dependencies = [
    "h11>=0.16",
    "truststore>=0.10; python_version >= '3.10'",
]

[project.optional-dependencies]
http2 = ["h2>=3,<5"]
socks = ["socksio==1.*"]
trio = ["trio>=0.26.2; python_version < '3.10'", "trio>=0.33.0,<1.0; python_version >= '3.10'"]
asyncio = ["anyio>=4.5.0,<5.0"]

[project.urls]
Source = "https://github.com/pydantic/httpx2/tree/v2.12.0/src/httpcore2"

[tool.hatch.build.targets.wheel]
packages = ["httpcore2"]
