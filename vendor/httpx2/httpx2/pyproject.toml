[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "httpx2"
version = "2.12.0"
description = "An HTTP client, vendored for the FastMCP Python 3.8 port."
requires-python = ">=3.8"
license = { file = "LICENSE.md" }
authors = [{ name = "Tom Christie", email = "tom@tomchristie.com" }]
dependencies = [
    "anyio>=4.5; python_version < '3.10' and sys_platform != 'emscripten'",
    "anyio>=4.10; python_version >= '3.10' and sys_platform != 'emscripten'",
    "httpcore2==2.12.0; sys_platform != 'emscripten'",
    "httpx2-jsfetch; sys_platform == 'emscripten' and python_version >= '3.12'",
    "idna>=3.10; python_version < '3.10'",
    "idna>=3.18; python_version >= '3.10'",
    "truststore>=0.10; python_version >= '3.10' and sys_platform != 'emscripten'",
    "typing-extensions>=4.5; python_version < '3.13'",
]

[project.optional-dependencies]
brotli = [
    "brotli>=1.0; platform_python_implementation == 'CPython' and python_version < '3.10'",
    "brotli>=1.2.0; platform_python_implementation == 'CPython' and python_version >= '3.10'",
    "brotlicffi>=1.0; platform_python_implementation != 'CPython' and python_version < '3.10'",
    "brotlicffi>=1.2.0.0; platform_python_implementation != 'CPython' and python_version >= '3.10'",
]
cli = ["click>=8.1; python_version < '3.10'", "click>=8.4.2; python_version >= '3.10'", "pygments==2.*", "rich>=10,<16"]
http2 = ["h2>=3,<5"]
socks = ["socksio==1.*"]
ws = ["wsproto>=1.2"]
zstd = ["zstandard>=0.22; python_version < '3.9'", "backports.zstd>=1.0.0; python_version >= '3.9' and python_version <= '3.13'"]

[project.scripts]
httpx2 = "httpx2._main:main"

[project.urls]
Source = "https://github.com/pydantic/httpx2/tree/v2.12.0/src/httpx2"

[tool.hatch.build.targets.wheel]
packages = ["httpx2"]
