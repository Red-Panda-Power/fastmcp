[project]
name = "fastmcp-httpx2-compat-tests"
version = "0.0.0"
description = "Development checks for the vendored HTTP transport."
requires-python = ">=3.8"
dependencies = ["httpx2[brotli,http2,socks,ws,zstd]==2.12.0"]

[dependency-groups]
dev = [
    "chardet==5.2.0",
    "pytest>=8.3.3,<9",
    "pytest-timeout>=2.4.0",
    "starlette>=0.27",
    "trustme>=1.1,<2",
    "trio>=0.26.2",
    "uvicorn>=0.31.1",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["httpcore2", "httpx2"]

[tool.uv.sources]
httpcore2 = { workspace = true }
httpx2 = { workspace = true }

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py38"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403", "F405"]
