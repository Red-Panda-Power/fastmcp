[project]
name = "fastmcp-monty-compat-tests"
version = "0.0.0"
description = "Python compatibility checks for the vendored Monty sandbox."
requires-python = ">=3.8"
dependencies = [
    "pydantic-monty==1.1.0",
    "pydantic-monty-client==1.1.0",
    "pydantic-monty-runtime==1.1.0",
]

[dependency-groups]
dev = [
    "inline-snapshot>=0.27.2",
    "pytest>=8.3.3,<9",
    "pytest-asyncio>=0.24.0",
    "pytest-timeout>=2.4.0",
]

[tool.uv]
package = false

[tool.uv.workspace]

[tool.uv.sources]
pydantic-monty = { path = "packages/pydantic-monty" }
pydantic-monty-client = { path = "crates/monty-python" }
pydantic-monty-runtime = { path = "crates/monty-runtime" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = ["--inline-snapshot=disable"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py38"
line-length = 120
extend-exclude = ["crates/monty-typeshed/custom", "crates/monty-typeshed/vendor"]
force-exclude = true

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
