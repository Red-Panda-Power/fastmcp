[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "sse-starlette"
version = "3.7.0"
description = "Server-sent events for Starlette, vendored for Python 3.8."
requires-python = ">=3.8"
license = { file = "LICENSE" }
authors = [{ name = "sysid", email = "sysid@gmx.de" }]
dependencies = [
    "anyio>=4.5,<4.6; python_version < '3.9'",
    "anyio>=4.7; python_version >= '3.9'",
    "exceptiongroup>=1.2; python_version < '3.11'",
    "starlette>=0.41.3; python_version < '3.9'",
    "starlette>=0.49.1; python_version >= '3.9'",
]

[project.urls]
Source = "https://github.com/sysid/sse-starlette/tree/v3.7.0"

[dependency-groups]
dev = ["httpx>=0.28.1,<0.29", "pytest>=8.3.4,<9", "pytest-asyncio>=0.23.8,<0.25", "pytest-timeout>=2.4.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["sse_starlette"]

[tool.ruff]
target-version = "py38"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
