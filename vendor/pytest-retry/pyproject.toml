[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pytest-retry"
version = "1.7.0"
description = "Retry flaky tests in CI environments"
requires-python = ">=3.8"
license = { file = "LICENSE" }
dependencies = ["pytest>=7"]

[project.entry-points.pytest11]
pytest-retry = "pytest_retry.retry_plugin"

[dependency-groups]
dev = ["pytest>=8.3.3,<9", "pytest-xdist>=3.6.1"]

[tool.hatch.build.targets.wheel]
packages = ["pytest_retry"]

[tool.pytest.ini_options]
addopts = "-p no:pytest-retry"
testpaths = ["tests"]

[tool.ruff]
target-version = "py38"
line-length = 99
